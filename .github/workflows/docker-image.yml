name: Docker Image CI
on: [push, pull_request]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Uncomment to disable this job if it is not needed
    if: false
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            image: rhel94
          #- runner: ubuntu-26.04-arm
          #  image: ubuntu2604-arm64
          #- runner: ubuntu-latest
          #  image: ubuntu2604-icpx
          #- runner: ubuntu-latest
          #  image: alpine320
          #- runner: ubuntu-latest
          #  image: ubuntu2604
          #- runner: ubuntu-latest
          #  image: ubuntu2604-pfring
          #  test-flags: pfring
          #- runner: ubuntu-latest
          #  image: ubuntu2004
          #- runner: ubuntu-latest
          #  image: ubuntu2004-zstd
          #- runner: ubuntu-latest
          #  image: ubuntu2404-dpdk2311
          #- runner: ubuntu-latest
          #  image: ubuntu2404-dpdk2411
          #- runner: ubuntu-latest
          #  image: ubuntu2204-dpdk2211
          #- runner: ubuntu-latest
          #  image: ubuntu2404
          #- runner: ubuntu-24.04-arm
          #  image: ubuntu2404-arm64
          #- runner: ubuntu-latest
          #  image: alpine319
          #- runner: ubuntu-latest
          #  image: fedora38
          #- runner: ubuntu-latest
          #  image: fedora38
          #- runner: ubuntu-latest
          #  image: fedora39
          #  runner: ubuntu-latest
          #  image: fedora40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build . --file Dockerfile-${{ matrix.image }} --tag seladb/${{ matrix.image }}:latest \
            --secret id=redhat_username,env=REDHAT_USERNAME \
            --secret id=redhat_password,env=REDHAT_PASSWORD
        env:
          REDHAT_USERNAME: ${{ secrets.REDHAT_USERNAME }}
          REDHAT_PASSWORD: ${{ secrets.REDHAT_PASSWORD }}

      - name: Test PcapPlusPlus
        run: ./test-pcapplusplus.sh ${{ matrix.image }} ${{ matrix.test-flags }}

      - name: Push to DockerHub
        run: |
          echo ${{ secrets.DOCKER_PASS }} | docker login -u ${{ secrets.DOCKER_USER }} --password-stdin
          docker push seladb/${{ matrix.image }}:latest
        if: ${{ !github.event.pull_request.head.repo.fork && github.ref == 'refs/heads/master' }}

  build-cppcheck:
    # Uncomment to disable this job if it is not needed
    # if: false
    runs-on: ubuntu-latest
    # TODO: Provide better solution for this, as cppcheck image is layered over the base alpine image.
    #  If alpine image is updated, the cppcheck image might need a rebuild too.
    # needs: build
    env:
      CPPCHECK_VERSION: 2.9.3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build cppcheck image
        run: |
          docker build . --build-arg CPPCHECK_VERSION=${{ env.CPPCHECK_VERSION }} --file Dockerfile-alpine320-cppcheck --tag seladb/alpine320-cppcheck:${{ env.CPPCHECK_VERSION }}

      - name: Test cppcheck
        run: |
          docker run --rm seladb/alpine320-cppcheck:${{ env.CPPCHECK_VERSION }} cppcheck --version

      - name: Push to DockerHub
        run: |
          echo ${{ secrets.DOCKER_PASS }} | docker login -u ${{ secrets.DOCKER_USER }} --password-stdin
          docker push seladb/alpine320-cppcheck:${{ env.CPPCHECK_VERSION }}
        if: ${{ !github.event.pull_request.head.repo.fork && github.ref == 'refs/heads/master' }}